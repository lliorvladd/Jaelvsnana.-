<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My precious girl</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@1,900&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#050204;--wine:#7b0f2e;--rose:#e0345f;--glow:#ff8fa8;--ink:#fbeef1;--soft:#d9a3b0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050204;--ink:#fbeef1}}
:root[data-theme="dark"]{--bg:#050204;--ink:#fbeef1}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#bg{position:fixed;inset:0;z-index:0}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;filter:grayscale(1) contrast(1.1) brightness(.5) blur(2px);transition:opacity 2.5s ease}
.ph.on{opacity:.55}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(123,15,46,.35),rgba(5,2,4,.92) 75%)}
.lily{position:fixed;bottom:-6px;z-index:1;transform-origin:50% 100%;opacity:.9;filter:drop-shadow(0 0 14px rgba(224,52,95,.45))}
.l1{left:-18px;width:150px;animation:sway 7s ease-in-out infinite}
.l2{right:-22px;width:175px;transform:scaleX(-1);animation:sway2 8s ease-in-out infinite}
.l3{left:92px;width:92px;opacity:.6;animation:sway 9s ease-in-out infinite .8s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sway2{0%,100%{transform:scaleX(-1) rotate(-3deg)}50%{transform:scaleX(-1) rotate(3deg)}}
#stage{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px;pointer-events:none}
#lead{font-family:'Pinyon Script','Snell Roundhand',cursive;font-size:clamp(1.7rem,8vw,2.8rem);color:var(--glow);margin:0 0 .15em;text-shadow:0 0 18px rgba(224,52,95,.7)}
#big{font-family:'Playfair Display',Didot,'Bodoni 72',Georgia,serif;font-style:italic;font-weight:900;text-transform:uppercase;font-size:clamp(2.6rem,15vw,5.6rem);line-height:1;letter-spacing:.02em;margin:0;color:var(--ink);text-shadow:0 0 28px rgba(224,52,95,.55),0 4px 24px #000}
#es{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(.95rem,3.8vw,1.15rem);color:var(--soft);margin:.9em 0 0;letter-spacing:.04em}
.in{animation:pop 1.1s cubic-bezier(.2,.8,.2,1) both}
.in2{animation:rise 1.2s ease .25s both}
@keyframes pop{from{opacity:0;transform:scale(1.18);filter:blur(10px);letter-spacing:.18em}to{opacity:1;transform:none;filter:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.scr{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(ellipse at center,rgba(60,6,22,.78),rgba(5,2,4,.97));transition:opacity 1.2s ease}
.scr.off{opacity:0;pointer-events:none}
.scr h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(2.8rem,15vw,5rem);margin:0 0 .3em;color:var(--ink);text-shadow:0 0 26px rgba(224,52,95,.75)}
.scr p{font-style:italic;color:var(--soft);margin:0 0 1.6em;letter-spacing:.05em}
button{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:900;font-size:1.05rem;letter-spacing:.08em;color:var(--ink);background:linear-gradient(135deg,var(--wine),#b01a45);border:1px solid rgba(255,143,168,.5);border-radius:999px;padding:.85em 2.2em;cursor:pointer;box-shadow:0 0 28px rgba(224,52,95,.45);animation:beat 2.4s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 0 44px rgba(224,52,95,.8);transform:scale(1.04)}}
.pol{display:flex;gap:10px;margin:0 0 1.4em;justify-content:center}
.pol img{width:27vw;max-width:120px;aspect-ratio:3/4;object-fit:cover;border:5px solid #f3e6e9;border-bottom-width:16px;filter:grayscale(1);box-shadow:0 8px 24px #000;animation:rise 1.4s ease both}
.pol img:nth-child(1){transform:rotate(-6deg)}.pol img:nth-child(2){transform:translateY(-8px) rotate(2deg);animation-delay:.2s}.pol img:nth-child(3){transform:rotate(7deg);animation-delay:.4s}
</style>
</head>

<script>
var CUES=[
[0,"Somewhere along the way,","I fell for you","En algún momento, me enamoré de ti"],
[4,"And now, at last,","I see it","Y ahora, por fin, lo veo"],
[8,"My heart keeps choosing","you","Mi corazón sigue eligiéndote"],
[12,"Here I am,","waiting","Aquí estoy, esperándote"],
[16,"Falling again,","for you","Cayendo otra vez, por ti"],
[18.5,"You are","my fate","Tú eres mi destino"],
[22.5,"The one who will shine as","my star","Quien brillará como mi estrella"],
[28.5,"Someone I will love with","all of me","Alguien a quien amaré con todo lo que soy"]
];
var a=document.getElementById('a'),lead=document.getElementById('lead'),big=document.getElementById('big'),es=document.getElementById('es'),phs=document.querySelectorAll('.ph'),cur=-1,bgi=-1,running=false;
function show(i){cur=i;var c=CUES[i];lead.textContent=c[1];big.textContent=c[2];es.textContent=c[3];
[[lead,'in2'],[big,'in'],[es,'in2']].forEach(function(p){p[0].classList.remove('in','in2');void p[0].offsetWidth;p[0].classList.add(p[1])})}
function clear(){cur=-1;lead.textContent=big.textContent=es.textContent=''}
function tick(){if(!running)return;var t=a.currentTime,k=-1;for(var i=0;i<CUES.length;i++){if(t>=CUES[i][0])k=i}
if(k!==cur&&k>=0)show(k);
var b=t<12?0:t<24?1:2;if(b!==bgi){bgi=b;phs.forEach(function(p,j){p.classList.toggle('on',j===b)})}
requestAnimationFrame(tick)}
function play(){document.getElementById('start').classList.add('off');document.getElementById('end').classList.add('off');a.currentTime=0;clear();bgi=-1;running=true;var p=a.play();if(p&&p.catch)p.catch(function(){});tick()}
a.addEventListener('ended',function(){running=false;clear();document.getElementById('end').classList.remove('off')});
document.getElementById('go').onclick=play;document.getElementById('again').onclick=play;
/* canvas: stars, floating lights, petals */
var cv=document.getElementById('c'),x=cv.getContext('2d'),W,H,D=Math.min(window.devicePixelRatio||1,2),S=[],L=[],P=[];
function rs(){W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();
function R(m,n){return m+Math.random()*(n-m)}
for(var i=0;i<80;i++)S.push({x:R(0,1),y:R(0,1),r:R(.5,1.6),p:R(0,6.3),s:R(.6,1.8)});
for(var i=0;i<26;i++)L.push({x:R(0,1),y:R(0,1),r:R(5,16),vx:R(-.08,.08),vy:R(-.25,-.06),p:R(0,6.3)});
var WC=['#7b0f2e','#a3163f','#c2204f','#5a0a22','#e0345f'];
for(var i=0;i<28;i++)P.push({x:R(0,1)*innerWidth,y:R(-1,1)*innerHeight,s:R(8,17),vy:R(.5,1.4),vx:R(-.4,.4),a:R(0,6.3),va:R(-.03,.03),ph:R(0,6.3),vp:R(.02,.05),c:WC[i%5],o:R(.6,.95)});
function petal(p){x.save();x.translate(p.x,p.y);x.rotate(p.a);x.scale(1,Math.cos(p.ph));x.globalAlpha=p.o;x.fillStyle=p.c;x.beginPath();x.moveTo(0,-p.s);x.bezierCurveTo(p.s*.9,-p.s*.5,p.s*.7,p.s*.7,0,p.s);x.bezierCurveTo(-p.s*.7,p.s*.7,-p.s*.9,-p.s*.5,0,-p.s);x.fill();x.restore()}
function draw(tm){x.clearRect(0,0,W,H);var t=tm/1000;
S.forEach(function(s){x.globalAlpha=.25+.75*Math.abs(Math.sin(t*s.s+s.p));x.fillStyle='#ffe3ea';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,6.3);x.fill()});
x.globalCompositeOperation='lighter';
L.forEach(function(l){l.x+=l.vx/W*60*.016;l.y+=l.vy/H*60*.016;if(l.y<-.05){l.y=1.05;l.x=R(0,1)}var al=.18+.22*Math.sin(t*1.2+l.p);var g=x.createRadialGradient(l.x*W,l.y*H,0,l.x*W,l.y*H,l.r*2.4);g.addColorStop(0,'rgba(255,143,168,'+al+')');g.addColorStop(1,'rgba(255,143,168,0)');x.globalAlpha=1;x.fillStyle=g;x.beginPath();x.arc(l.x*W,l.y*H,l.r*2.4,0,6.3);x.fill()});
x.globalCompositeOperation='source-over';
P.forEach(function(p){p.y+=p.vy;p.x+=p.vx+Math.sin(t+p.s)*.4;p.a+=p.va;p.ph+=p.vp;if(p.y>H+20){p.y=-20;p.x=R(0,W)}petal(p)});
x.globalAlpha=1;requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script>
